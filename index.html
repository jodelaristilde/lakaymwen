    </div>
  </section>

  <section id="about" class="band dark">
    <div class="wrap split">
      <div>
        <p class="eyebrow" data-t="ab_e"></p>
        <h2 data-t="ab_h"></h2>
        <p data-t="ab_1"></p><p data-t="ab_2"></p><p data-t="ab_3"></p>
      </div>
      <aside class="safe">
        <h3 data-t="safe_h"></h3>
        <ul><li data-t="safe_1"></li><li data-t="safe_2"></li><li data-t="safe_3"></li><li data-t="safe_4"></li></ul>
      </aside>
    </div>
  </section>
</main>

<footer id="contact">
  <div class="wrap foot-row">
    <a class="brand light" href="#home"><span>Lakaymwen</span></a>
    <span><span data-t="contact_us"></span> <span id="contact-email"></span></span>
    <a href="#privacy" class="foot-link" data-t="privacy_h"></a>
    <span>© 2004–<span id="year"></span></span>
  </div>
</footer>

<!-- Log in / register -->
<dialog id="dlg-auth">
  <div class="dlg-head"><h2 id="auth-title"></h2><button class="dlg-close" type="button" data-close aria-label="Close">×</button></div>
  <div class="dlg-body">
    <form id="login-form" novalidate>
      <label><span data-t="email"></span><input id="l-email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false"></label>
      <label><span data-t="password"></span><input id="l-pass" type="password" required autocomplete="current-password"></label>
      <button class="btn dark big" type="submit" data-t="login_btn"></button>
      <button class="linkbtn" type="button" data-forgot data-t="forgot"></button>
      <p class="note center"><span data-t="new_here"></span> <a href="#register" data-t="reg_pick"></a></p>
    </form>
    <p class="msg" id="auth-msg" hidden></p>
  </div>
</dialog>

<!-- Profile -->
<dialog id="dlg-profile">
  <div class="dlg-head"><h2 data-t="profile_h"></h2><button class="dlg-close" type="button" data-close aria-label="Close">×</button></div>
  <div class="dlg-body">
    <form id="profile-form" novalidate>
      <div class="photo-edit">
        <div id="pr-photo-preview"></div>
        <div class="photo-btns">
          <label class="btn ghost small file-btn"><span data-t="choose_photo"></span><input id="pr-photo" type="file" accept="image/*" hidden></label>
          <button class="linkbtn" type="button" id="pr-photo-remove" data-t="remove_photo"></button>
          <p class="note" data-t="photo_note"></p>
        </div>
      </div>
      <div class="two">
        <label><span class="req" data-t="first_name"></span><input id="pr-first" type="text" maxlength="40" autocomplete="given-name"></label>
        <label><span class="req" data-t="last_name"></span><input id="pr-last" type="text" maxlength="40" autocomplete="family-name"></label>
      </div>
      <label><span data-t="nickname"></span><input id="pr-nick" type="text" maxlength="40" placeholder="Ti Djo, Gége…"></label>
      <label><span data-t="your_town"></span><select id="pr-town"><option value="" data-t="pick_town"></option></select></label>
      <label><span data-t="katye"></span><input id="pr-katye" type="text" maxlength="80" data-ph="katye_ph" placeholder="Lalue, Bel-Air, Carrefour-Feuilles…"></label>
      <div class="two">
        <label><span data-t="cur_country"></span><select id="pr-country"><option value="" data-t="pick_country"></option></select></label>
        <label id="pr-state-wrap" hidden><span data-t="cur_state"></span><select id="pr-state"><option value="" data-t="pick_state"></option></select></label>
      </div>
      <label><span data-t="cur_city"></span><input id="pr-lives" type="text" maxlength="60" placeholder="Miami, Boston, Montréal…"></label>

      <h3 class="form-h"><span data-t="schools"></span> <small data-t="optional"></small></h3>
      <div class="list-rows" id="pr-schools"></div>
      <button class="btn ghost small add-fam" type="button" data-add-school="pr" data-t="add_school"></button>

      <label><span data-t="describe"></span><textarea id="pr-bio" maxlength="600"></textarea></label>

      <h3 class="form-h"><span data-t="sec_family"></span> <small data-t="optional"></small></h3>
      <p class="note" data-t="family_note"></p>
      <div class="family-list" id="pr-family"></div>
      <button class="btn ghost small add-fam" type="button" data-add-family="pr" data-t="add_family"></button>
      <label class="check"><input id="pr-listed" type="checkbox" checked><span data-t="listed"></span></label>
      <label class="check"><input id="pr-founding" type="checkbox"><span data-t="founding_q"></span></label>
      <label id="pr-old-wrap" hidden><span data-t="old_username"></span><input id="pr-old" type="text" maxlength="40"></label>
      <button class="btn dark big" type="submit" data-t="save"></button>
    </form>
    <p class="msg" id="profile-msg" hidden></p>
    <div class="danger">
      <button class="linkbtn danger-link" type="button" id="del-start" data-t="delete_account"></button>
      <div id="del-confirm" hidden>
        <p data-t="delete_warn"></p>
        <label><span data-t="delete_type"></span><input id="del-word" type="text" autocomplete="off" autocapitalize="characters"></label>
        <div class="row-btns">
          <button class="btn red" type="button" id="del-go" data-t="delete_forever"></button>
          <button class="btn ghost" type="button" id="del-cancel" data-t="cancel"></button>
        </div>
        <p class="msg" id="del-msg" hidden></p>
      </div>
    </div>
    <div id="my-notices-wrap" hidden>
      <h3 class="h3" data-t="my_notices"></h3>
      <div id="my-notices"></div>
    </div>
  </div>
</dialog>

<!-- Forgot password: email code, then a new password -->
<dialog id="dlg-forgot">
  <div class="dlg-head"><h2 data-t="forgot_h"></h2><button class="dlg-close" type="button" data-close aria-label="Close">×</button></div>
  <div class="dlg-body">
    <form id="forgot-form" novalidate>
      <p class="note" data-t="forgot_p"></p>
      <label><span data-t="email"></span><input id="f-email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false"></label>
      <button class="btn dark big" type="submit" data-t="send_code"></button>
    </form>
    <form id="reset-form" novalidate hidden>
      <p id="reset-text"></p>
      <label><span data-t="code_label"></span><input id="f-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></label>
      <div class="two">
        <label><span data-t="new_pass"></span><input id="f-pass" type="password" autocomplete="new-password"></label>
        <label><span data-t="password2"></span><input id="f-pass2" type="password" autocomplete="new-password"></label>
      </div>
      <button class="btn red big" type="submit" data-t="set_pass"></button>
    </form>
    <p class="msg" id="forgot-msg" hidden></p>
  </div>
</dialog>

<!-- Department -->
<dialog id="dlg-dept">
  <div class="dlg-head"><h2 id="dept-title"></h2><button class="dlg-close" type="button" data-close aria-label="Close">×</button></div>
  <div class="dlg-body">
    <p class="note" id="dept-cap"></p>
    <p class="dept-pick" data-t="dept_pick"></p>
    <ul class="chips" id="dept-towns"></ul>
  </div>
</dialog>

<!-- Town -->
<dialog id="dlg-town">
  <div class="dlg-head"><h2 id="town-title"></h2><button class="dlg-close" type="button" data-close aria-label="Close">×</button></div>
  <div class="dlg-body">
    <button class="btn red big" type="button" id="town-register"></button>
    <div id="town-katye" hidden><h3 class="h3" data-t="town_katye_h"></h3><div class="chips" id="town-katye-list"></div></div>
    <h3 class="h3" data-t="town_members"></h3>
    <div class="people" id="town-members"></div>
  </div>
</dialog>

<!-- Messages -->
<dialog id="dlg-inbox">
  <div class="dlg-head"><h2 id="inbox-title"></h2><button class="dlg-close" type="button" data-close aria-label="Close">×</button></div>
  <div class="dlg-body">
    <button class="linkbtn" type="button" id="inbox-back" data-t="back" hidden></button>
    <div class="thread-list" id="thread-list"></div>
    <div id="thread" hidden>
      <div class="bubbles" id="bubbles"></div>
      <form id="reply-form" class="reply">
        <textarea id="reply-body" required maxlength="2000" aria-label="Message"></textarea>
        <button class="btn dark" type="submit" data-t="send"></button>
      </form>
    </div>
    <p class="msg" id="inbox-msg" hidden></p>
  </div>
</dialog>

<!-- Add an old photo -->
<dialog id="dlg-photo">
  <div class="dlg-head"><h2 data-t="photo_add_h"></h2><button class="dlg-close" type="button" data-close aria-label="Close">×</button></div>
  <div class="dlg-body">
    <form id="photo-form" novalidate>
      <label class="photo-drop" id="ph-drop">
        <input id="ph-file" type="file" accept="image/*">
        <img id="ph-preview" alt="" hidden>
        <span id="ph-drop-text" data-t="photo_pick"></span>
      </label>
      <label><span data-t="photo_caption"></span><textarea id="ph-caption" maxlength="500" data-ph="photo_caption_ph"></textarea></label>
      <div class="two">
        <label><span data-t="photo_town"></span><select id="ph-town"><option value="" data-t="photo_town_unknown"></option></select></label>
        <label><span data-t="photo_year"></span><input id="ph-year" type="text" maxlength="20" inputmode="numeric" data-ph="photo_year_ph"></label>
      </div>
      <div class="tag-field">
        <span class="lbl" data-t="photo_who"></span>
        <div class="tag-chips" id="ph-tags"></div>
        <div class="tag-picker" id="ph-picker"></div>
      </div>
      <p class="note" data-t="photo_rules"></p>
      <button class="btn red big" type="submit" data-t="photo_share"></button>
      <p class="msg" id="photo-msg" hidden></p>
    </form>
  </div>
</dialog>

<!-- Report -->
<dialog id="dlg-report">
  <div class="dlg-head"><h2 id="report-title"></h2><button class="dlg-close" type="button" data-close aria-label="Close">×</button></div>
  <div class="dlg-body">
    <form id="report-form" novalidate>
      <label><span class="req" data-t="report_why"></span><select id="rep-reason">
        <option value="" data-t="report_pick"></option>
        <option value="fake" data-t="rr_fake"></option>
        <option value="scam" data-t="rr_scam"></option>
        <option value="harass" data-t="rr_harass"></option>
        <option value="photo" data-t="rr_photo"></option>
        <option value="minor" data-t="rr_minor"></option>
        <option value="other" data-t="rr_other"></option>
      </select></label>
      <label><span data-t="report_details"></span><textarea id="rep-details" maxlength="1000"></textarea></label>
      <label class="check"><input id="rep-block" type="checkbox" checked><span data-t="report_also_block"></span></label>
      <button class="btn red big" type="submit" data-t="report_send"></button>
      <p class="note" data-t="report_note"></p>
    </form>
    <p class="msg" id="report-msg" hidden></p>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="towns.js"></script>
<script src="depts.js"></script>
<script src="geo.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
